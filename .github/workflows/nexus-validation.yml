name: Nexus validation

on:
  push:
    branches:
      - nexus
  pull_request:
    branches:
      - nexus
  workflow_dispatch:

concurrency:
  group: nexus-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Root and RelayKit validation
    if: github.repository == 'NexusAgentX/new-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build embedded frontend
        working-directory: web
        env:
          CI: ""
          DISABLE_ESLINT_PLUGIN: 'true'
        run: VITE_REACT_APP_VERSION="$(cat ../VERSION)" bun run build

      - name: Download root module dependencies
        run: go mod download

      - name: Download RelayKit dependencies independently
        working-directory: relaykit
        run: go mod download

      - name: Vet root module
        run: go vet ./...

      - name: Vet RelayKit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build RelayKit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root module
        run: go test ./...

      - name: Test RelayKit independently
        working-directory: relaykit
        run: go test ./...

  frontend:
    name: Frontend typecheck, test, and build
    if: github.repository == 'NexusAgentX/new-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        env:
          CI: ""
          DISABLE_ESLINT_PLUGIN: 'true'
        run: VITE_REACT_APP_VERSION="$(cat ../VERSION)" bun run build
