name: Nexus validation

on:
  workflow_dispatch:
  push:
    branches:
      - nexus
  pull_request:
    branches:
      - nexus

concurrency:
  group: nexus-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go backend tests
    if: github.repository == 'NexusAgentX/new-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build embedded frontend assets
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          DISABLE_ESLINT_PLUGIN='true' \
            VITE_REACT_APP_VERSION="$(cat ../../VERSION)" \
            bun run build
          cd ..
          bun install --filter ./classic --frozen-lockfile
          cd classic
          VITE_REACT_APP_VERSION="$(cat ../../VERSION)" \
            bun run build

      - name: Download Go modules
        run: go mod download

      - name: Run backend tests
        run: go test ./...

  frontend:
    name: Frontend builds
    if: github.repository == 'NexusAgentX/new-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build default frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          DISABLE_ESLINT_PLUGIN='true' \
            VITE_REACT_APP_VERSION="$(cat ../../VERSION)" \
            bun run build

      - name: Build classic frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --filter ./classic --frozen-lockfile
          cd classic
          VITE_REACT_APP_VERSION="$(cat ../../VERSION)" \
            bun run build
